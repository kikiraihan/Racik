# Jalankan semua: docker compose up --build
# Demo tanpa API key kenari.id: docker compose --profile demo up --build
#   lalu set KENARI_BASE_URL=http://mockkenari:9090/v1 dan KENARI_API_KEY=mock di .env
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: racik
      POSTGRES_PASSWORD: racik
      POSTGRES_DB: racik
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://racik:racik@db:5432/racik?sslmode=disable
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_API_TARGET: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

  mockkenari:
    build: ./backend
    command: ["mockkenari"]
    profiles: ["demo"]
    ports:
      - "9090:9090"

volumes:
  pgdata:
  uploads:
