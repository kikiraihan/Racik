name: Deploy ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "Lewati backup DB sebelum deploy"
        type: boolean
        default: false

permissions:
  contents: read

# Cegah dua deploy Racik jalan bersamaan di VPS yang sama. Nama group sengaja
# beda dengan our-life-planner (deploy-production) — repo lain tidak saling
# menunggu, karena concurrency group hanya berlaku per repo.
concurrency:
  group: deploy-racik-production
  cancel-in-progress: false

jobs:
  # Deploy hanya jalan kalau CI (backend, frontend, docker image) lulus.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: SSH deploy
    needs: ci
    runs-on: ubuntu-latest
    # Build Nuxt + Go di VPS yang dipakai bareng app lain bisa lambat; ini cuma
    # jaring pengaman kalau ada yang menggantung.
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_DIR: ${{ secrets.APP_DIR || '/var/www/racik' }}
      DEPLOY_BRANCH: ${{ github.ref_name }}
      SKIP_BACKUP: ${{ inputs.skip_backup && '1' || '0' }}
    steps:
      - name: Siapkan kunci SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "Secret SSH_HOST belum diisi."; exit 1; }
          test -n "$SSH_USER" || { echo "Secret SSH_USER belum diisi."; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Secret SSH_PRIVATE_KEY belum diisi."; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Secret SSH_KNOWN_HOSTS kosong; host key diambil lewat ssh-keyscan (tanpa verifikasi)."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Jalankan deploy di VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              "$SSH_USER@$SSH_HOST" \
              "cd '$APP_DIR' && DEPLOY_BRANCH='$DEPLOY_BRANCH' SKIP_BACKUP='$SKIP_BACKUP' ./scripts/deploy.sh"

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Server: \`$SSH_USER@$SSH_HOST:$APP_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bersihkan kunci SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
